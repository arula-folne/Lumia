<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumia Overlay</title>
  <link rel="stylesheet" href="./overlay.css" />
</head>
<body data-anim="fade-left">
  <div class="stage" id="stage" hidden>
    <div class="card" id="card">
      <div class="accent" aria-hidden="true"></div>
      <div class="jacket" aria-hidden="true">
        <img id="jacket-img" alt="" />
        <div class="jacket-fallback" id="jacket-fallback"></div>
      </div>
      <div class="meta">
        <div class="text-block">
          <div class="album" id="album" hidden></div>
          <div class="title" id="title">Track</div>
          <div class="artist" id="artist" hidden></div>
          <div class="duration" id="duration">0:00 / 0:00</div>
        </div>
      </div>
    </div>
  </div>
  <script src="./overlay.js" type="module"></script>
</body>
</html>
